name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Compile Python sources
        run: uv run python -m compileall app.py bootstrap.py pages src tests
      - name: Run tests
        run: uv run pytest -q
